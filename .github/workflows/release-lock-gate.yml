name: Release Lock Gate

on:
  pull_request:
    branches: [ develop ]
  merge_group:
    types: [ checks_requested ]

permissions:
  contents: read
  pull-requests: read

jobs:
  release-lock-gate:
    name: release-lock-gate
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.base.ref == 'develop') ||
      (github.event_name == 'merge_group' &&
       github.event.merge_group.base_ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted base revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          persist-credentials: false

      - name: Test release lock scenarios
        run: bash Scripts/test-check-release-lock.sh

      - name: Check release lock
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          ALLOWED_BACKMERGE_NUMBER=""

          if [ -n "$PR_NUMBER" ]; then
            ALLOWED_BACKMERGE_NUMBER="$PR_NUMBER"
          elif [[ "$MERGE_GROUP_HEAD_REF" =~ /pr-([0-9]+)- ]]; then
            ALLOWED_BACKMERGE_NUMBER="${BASH_REMATCH[1]}"
          fi

          if [ -n "$ALLOWED_BACKMERGE_NUMBER" ]; then
            bash Scripts/check-release-lock.sh "$ALLOWED_BACKMERGE_NUMBER"
          else
            bash Scripts/check-release-lock.sh
          fi
